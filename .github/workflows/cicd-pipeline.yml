name: CI/CD Pipeline Completo

on:
  pull_request:
    types: [ opened, synchronize, reopened, labeled, closed ]
    branches:
      - main
      - master
      - develop
      - 'release/*'
      - 'hotfix/*'
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 0 * * 1" # Para CodeQL
    - cron: '20 7 * * 2' # Para Scorecard
  branch_protection_rule: # Para Scorecard

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  validate_pr:
    name: Build PR
    env:
      JAVA_VERSION: '21'
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build and test with Gradle wrapper
        run: |
          chmod +x gradlew
          ./gradlew build --parallel --build-cache

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
        with:
          check_name: Test Results
          junit_files: '**/build/test-results/**/*.xml'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/jacoco/test/jacocoTestReport.xml
          slug: ${{ github.repository }}
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: '**/build/test-results/**/*.xml'
          slug: ${{ github.repository }}
          fail_ci_if_error: false

  validate_docker_image:
    name: Build Docker Image (PR)
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Só valida (sem push): o Dockerfile quebrado aparece na PR, não na hora da release.
      - name: Build image
        run: docker build --pull -t buddy-api:pr-check .

  dependency_review:
    name: Dependency Review
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1

  codeql_analysis:
    name: CodeQL Analysis
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ "java" ]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{matrix.language}}"

  scorecard_analysis:
    name: Scorecard Analysis
    if: github.event_name == 'branch_protection_rule' || github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Run analysis"
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: "Upload artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif

  prepare_minor_release:
    name: Prepare Minor Release Branch (MINOR)
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'develop' &&
      contains(github.event.pull_request.labels.*.name, 'create-release') &&
      !contains(github.event.pull_request.labels.*.name, 'create-major-release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'develop'
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY_PRIVATE }}

      - name: Configure Git User
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate and Create New MINOR Release Branch
        run: |
          git fetch --prune --tags
          LAST_TAG=$(git tag -l "v*.*.*" --sort=-v:refname | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v0.0.0"
          fi
          echo "Last tag: $LAST_TAG"
          LAST_TAG_NUM=${LAST_TAG#v}
          IFS='.' read -r -a V <<< "$LAST_TAG_NUM"
          V[1]=$((V[1] + 1))
          V[2]=0
          NEW_VERSION="v${V[0]}.${V[1]}.${V[2]}"
          BRANCH_NAME="release/$NEW_VERSION"
          echo "Creating new branch from develop: $BRANCH_NAME"
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"

      - name: Delete Merged Feature Branch
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Deleting merged feature branch: $SOURCE_BRANCH"
          git push origin --delete "$SOURCE_BRANCH"

  prepare_major_release:
    name: Prepare Major Release Branch (MAJOR)
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'develop' &&
      contains(github.event.pull_request.labels.*.name, 'create-major-release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'develop'
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY_PRIVATE }}

      - name: Configure Git User
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate and Create New MAJOR Release Branch
        run: |
          git fetch --prune --tags
          LAST_TAG=$(git tag -l "v*.*.*" --sort=-v:refname | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v0.0.0"
          fi
          echo "Last tag: $LAST_TAG"
          LAST_TAG_NUM=${LAST_TAG#v}
          IFS='.' read -r -a V <<< "$LAST_TAG_NUM"
          
          V[0]=$((V[0] + 1)) 
          V[1]=0             
          V[2]=0            
          NEW_VERSION="v${V[0]}.${V[1]}.${V[2]}"
          
          BRANCH_NAME="release/$NEW_VERSION"
          echo "Creating new branch from develop: $BRANCH_NAME"
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"

      - name: Delete Merged Feature Branch
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Deleting merged feature branch: $SOURCE_BRANCH"
          git push origin --delete "$SOURCE_BRANCH"

  finalize_release:
    name: Tag Release & Sync Develop
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      new_tag: ${{ steps.create_tag.outputs.new_tag }}
      tagged: ${{ steps.create_tag.outputs.should_run }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'main'
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and Push Gitflow Tag
        id: create_tag
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          NEW_TAG=""
          if [[ "$SOURCE_BRANCH" == "release/"* ]]; then
            NEW_TAG=$(echo "$SOURCE_BRANCH" | sed 's/release\///')
          elif [[ "$SOURCE_BRANCH" == "hotfix/"* ]]; then
            LAST_TAG=$(git tag -l "v*.*.*" --sort=-v:refname | head -n 1)
            LAST_TAG_NUM=${LAST_TAG#v}
            IFS='.' read -r -a V <<< "$LAST_TAG_NUM"
            V[2]=$((V[2] + 1))
            NEW_TAG="v${V[0]}.${V[1]}.${V[2]}"
          else
            echo "Merge to main is not from a release/hotfix branch. Skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "new_tag=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          git tag "$NEW_TAG" "$MERGE_COMMIT_SHA"
          git push origin "$NEW_TAG"
          echo "Tag $NEW_TAG created and pushed."
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with Changelog
        if: steps.create_tag.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.create_tag.outputs.new_tag }}
        run: |
          echo "Criando GitHub Release para a tag $NEW_TAG..."
          
          rc=0
          gh release view "$NEW_TAG" > /dev/null 2>&1 || rc=$?
          
          if [ $rc -eq 0 ]; then
            echo "Release $NEW_TAG já existe. Pulando criação."
          else
            # A flag --generate-notes cria o changelog automaticamente baseado nos PRs
            gh release create "$NEW_TAG" \
              --title "Release $NEW_TAG" \
              --generate-notes \
              --latest
          fi

      - name: Clean up old tags and releases (Keep last 5)
        if: steps.create_tag.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Buscando todas as tags..."
          git fetch --prune --tags
          
          # Lista tags com prefixo 'v*', ordena decrescente por versão e pula as 5 primeiras
          TAGS_TO_DELETE=$(git tag -l "v*" --sort=-v:refname | tail -n +6)
          
          if [ -z "$TAGS_TO_DELETE" ]; then
            echo "Nenhuma tag antiga para deletar. O total atual é 5 ou menos."
            exit 0
          fi
          
          echo "Tags marcadas para exclusão: $TAGS_TO_DELETE"
          
          for TAG in $TAGS_TO_DELETE; do
            echo "Limpando: $TAG"
          
            rc=0
            gh release view "$TAG" > /dev/null 2>&1 || rc=$?
          
            if [ $rc -eq 0 ]; then
              echo "Deletando GitHub Release e a Tag do Git: $TAG"
              gh release delete "$TAG" --cleanup-tag -y
            elif [ $rc -eq 4 ]; then
              echo "ERRO: Autenticação necessária para consultar release $TAG" >&2
              exit 1
            else
              echo "Release não encontrada (ou erro de API). Deletando apenas a Tag do Git: $TAG"
              git push --delete origin "$TAG" || true
            fi
          done

      - name: Create Sync Branch (main -> develop)
        if: steps.create_tag.outputs.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'develop'
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY_PRIVATE }}

      - name: Configure and Push Sync Branch
        id: sync_branch
        env:
          NEW_TAG: ${{ steps.create_tag.outputs.new_tag }}
        run: |
          SYNC_BRANCH_NAME="bot/sync-main-to-develop-${NEW_TAG}"
          echo "branch_name=$SYNC_BRANCH_NAME" >> "$GITHUB_OUTPUT"
          
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "Creating sync branch: $SYNC_BRANCH_NAME"
          git checkout -b "$SYNC_BRANCH_NAME"
          
          echo "Merging main into sync branch..."
          git merge origin/main --no-ff -m "chore: sync main after release ${NEW_TAG} [skip ci]"
          
          echo "Pushing sync branch..."
          git push origin "$SYNC_BRANCH_NAME"

      - name: Open Pull Request (main -> develop)
        if: steps.create_tag.outputs.should_run == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const new_tag = "${{ steps.create_tag.outputs.new_tag }}";
            const sync_branch = "${{ steps.sync_branch.outputs.branch_name }}";
            
            await github.rest.pulls.create({
              owner: owner,
              repo: repo,
              title: `🤖 Sync: main -> develop (Release ${new_tag})`,
              head: sync_branch,
              base: 'develop',
              body: `Sincronização automática da \`main\` de volta para a \`develop\` após a release \`${new_tag}\`.
            
              Este PR rodará os status checks. Assim que passarem, pode ser mergeado.`
            });

      - name: Delete Merged Release or Hotfix Branch
        if: steps.create_tag.outputs.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY_PRIVATE }}
      - env:
          BRANCH_TO_DELETE: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Deleting merged release/hotfix branch: ${BRANCH_TO_DELETE}"
          git push origin --delete "${BRANCH_TO_DELETE}"

  publish_image:
    name: Publish Image (GHCR)
    runs-on: ubuntu-latest
    needs: finalize_release
    if: needs.finalize_release.result == 'success' && needs.finalize_release.outputs.tagged == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      # fetch-depth 0: o com.palantir.git-version resolve a versão do jar pela tag dentro do docker build.
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.finalize_release.outputs.new_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build and push image
        id: publish
        env:
          NEW_TAG: ${{ needs.finalize_release.outputs.new_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${NEW_TAG#v}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --pull -t "$IMAGE_REPO:$VERSION" -t "$IMAGE_REPO:latest" .
          docker push "$IMAGE_REPO:$VERSION"
          docker push "$IMAGE_REPO:latest"
          echo "image=$IMAGE_REPO:$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publicado: $IMAGE_REPO:$VERSION"

  # Substitui o deploy via Jenkins (propresto-deployer): o Enxame registra o deploy como pendente,
  # sobe um canário com a imagem nova e só troca a produção depois de aprovado no painel.
  deploy_to_enxame:
    name: Request Deploy (Enxame)
    runs-on: ubuntu-latest
    needs: publish_image
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Send signed webhook to Enxame
        env:
          ENXAME_URL: ${{ vars.ENXAME_URL }}
          ENXAME_WEBHOOK_SECRET: ${{ secrets.ENXAME_WEBHOOK_SECRET }}
          ENXAME_SERVICE_ID: ${{ vars.ENXAME_SERVICE_ID || 'buddy-api_buddy-api' }}
          IMAGE: ${{ needs.publish_image.outputs.image }}
        run: |
          if [ -z "$ENXAME_URL" ] || [ -z "$ENXAME_WEBHOOK_SECRET" ]; then
            echo "::warning::ENXAME_URL/ENXAME_WEBHOOK_SECRET não configurados — $IMAGE publicada, mas deploy NÃO pedido."
            exit 0
          fi
          BODY=$(jq -nc --arg s "$ENXAME_SERVICE_ID" --arg i "$IMAGE" '{service_id: $s, image: $i}')
          SIGNATURE=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$ENXAME_WEBHOOK_SECRET" | awk '{print $NF}')
          HTTP_STATUS=$(curl --silent --show-error --max-time 30 -w "%{http_code}" -o response.json \
            -X POST "${ENXAME_URL}/api/v1/webhooks/deploy" \
            -H "Content-Type: application/json" \
            -H "X-Enxame-Signature: $SIGNATURE" \
            --data-binary "$BODY")
          cat response.json; echo
          if [ "$HTTP_STATUS" != "202" ]; then
            echo "::error::Enxame respondeu HTTP $HTTP_STATUS — deploy de $IMAGE em $ENXAME_SERVICE_ID NÃO registrado."
            exit 1
          fi
          echo "Deploy de $IMAGE em $ENXAME_SERVICE_ID aguardando aprovação no Enxame."
